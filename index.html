<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>纸灯迷宫 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0a07; overflow:hidden; font-family:sans-serif; }
  #info {
    position:absolute; top:12px; left:0; right:0; text-align:center;
    color:#f0d9a0; z-index:10; text-shadow:0 0 8px #c9a227;
    pointer-events:none;
  }
  #title { font-size:18px; letter-spacing:3px; }
  #tip { font-size:12px; opacity:0.8; margin-top:4px; }
  #controls {
    position:absolute; bottom:24px; left:0; right:0;
    display:flex; justify-content:center; gap:16px; z-index:10;
  }
  .btn {
    width:60px; height:60px; border-radius:50%;
    background:rgba(201,162,39,0.3); border:2px solid #c9a227;
    color:#f5e6c8; font-size:22px; display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .btn:active { background:rgba(201,162,39,0.6); }
  #msg {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(13,10,7,0.95); padding:28px 36px; border-radius:12px;
    border:1px solid #c9a227; color:#f0d9a0; text-align:center; display:none; z-index:20;
  }
  #msg button {
    margin-top:18px; padding:10px 26px; background:#c9a227; border:none;
    border-radius:20px; color:#0d0a07; font-size:15px; font-weight:bold;
  }
</style>
</head>
<body>
  <div id="info">
    <div id="title">纸灯迷宫 · 3D</div>
    <div id="tip">收集灯笼 · 走到金色出口</div>
  </div>
  <div id="controls">
    <div class="btn" id="up">↑</div>
    <div class="btn" id="left">←</div>
    <div class="btn" id="down">↓</div>
    <div class="btn" id="right">→</div>
  </div>
  <div id="msg">
    <div id="msgText"></div>
    <button onclick="location.reload()">再玩一次</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 简单检测 WebGL
    function hasWebGL() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch(e) { return false; }
    }
    if (!hasWebGL()) {
      document.body.innerHTML = '<div style="color:#f0d9a0;text-align:center;padding:60px 20px;font-size:16px;">你的浏览器不支持 WebGL<br>无法运行 3D 画面<br><br>请换 Edge 或 Firefox 试试<br>或者告诉我，我给你 2D 版本</div>';
      throw new Error('No WebGL');
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a120b);
    scene.fog = new THREE.Fog(0x1a120b, 8, 22);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 灯光
    const amb = new THREE.AmbientLight(0x3a2a1a, 0.6);
    scene.add(amb);
    const dir = new THREE.DirectionalLight(0xffd080, 0.5);
    dir.position.set(5, 10, 5);
    scene.add(dir);

    // 迷宫参数
    const COLS = 11, ROWS = 11;
    const maze = [];
    for (let y=0; y<ROWS; y++) {
      maze[y] = [];
      for (let x=0; x<COLS; x++) maze[y][x] = 1;
    }
    function carve(x, y) {
      maze[y][x] = 0;
      const dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
      for (let [dx,dy] of dirs) {
        const nx=x+dx, ny=y+dy;
        if (nx>0 && nx<COLS-1 && ny>0 && ny<ROWS-1 && maze[ny][nx]===1) {
          maze[y+dy/2][x+dx/2] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(1,1);
    maze[ROWS-2][COLS-2] = 0;

    // 材质
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3d2e1f, roughness: 0.9 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a1f14, roughness: 1 });
    const paperMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, emissive: 0x3a2800, emissiveIntensity: 0.3 });

    // 地面
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS, ROWS), floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.position.set(COLS/2-0.5, 0, ROWS/2-0.5);
    scene.add(floor);

    // 墙
    const wallGeo = new THREE.BoxGeometry(1, 1.6, 1);
    for (let y=0; y<ROWS; y++) {
      for (let x=0; x<COLS; x++) {
        if (maze[y][x] === 1) {
          const wall = new THREE.Mesh(wallGeo, wallMat);
          wall.position.set(x, 0.8, y);
          scene.add(wall);
        }
      }
    }

    // 玩家位置
    let px = 1, pz = 1;
    camera.position.set(px, 1.2, pz);
    camera.lookAt(px, 1.2, pz-1);

    // 灯笼
    const lanterns = [];
    const lanternGeo = new THREE.SphereGeometry(0.22, 12, 12);
    function addLantern(x, z) {
      const light = new THREE.PointLight(0xffb84a, 1.2, 4);
      light.position.set(x, 1.1, z);
      scene.add(light);
      const mesh = new THREE.Mesh(lanternGeo, new THREE.MeshStandardMaterial({
        color: 0xffd070, emissive: 0xffa020, emissiveIntensity: 0.8
      }));
      mesh.position.set(x, 1.0, z);
      scene.add(mesh);
      lanterns.push({x, z, mesh, light, got: false});
    }
    // 随机放 4 个灯笼
    let placed = 0;
    while (placed < 4) {
      const x = 1 + Math.floor(Math.random()*(COLS-2));
      const z = 1 + Math.floor(Math.random()*(ROWS-2));
      if (maze[z][x]===0 && !(x===1&&z===1) && !(x===COLS-2&&z===ROWS-2) &&
          !lanterns.some(l=>l.x===x&&l.z===z)) {
        addLantern(x, z);
        placed++;
      }
    }

    // 出口
    const exitMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.15,16), paperMat);
    exitMesh.position.set(COLS-2, 0.1, ROWS-2);
    scene.add(exitMesh);
    const exitLight = new THREE.PointLight(0xffd070, 1.5, 5);
    exitLight.position.set(COLS-2, 1.5, ROWS-2);
    scene.add(exitLight);

    let collected = 0;
    let moving = false;

    function tryMove(dx, dz) {
      if (moving) return;
      const nx = px + dx, nz = pz + dz;
      if (nx<0||nx>=COLS||nz<0||nz>=ROWS||maze[nz][nx]===1) return;
      moving = true;
      const start = {x:px, z:pz};
      const end = {x:nx, z:nz};
      let t = 0;
      function anim() {
        t += 0.12;
        if (t >= 1) {
          px = nx; pz = nz;
          camera.position.set(px, 1.2, pz);
          moving = false;
          // 收集
          lanterns.forEach(l => {
            if (!l.got && l.x===px && l.z===pz) {
              l.got = true;
              l.mesh.visible = false;
              l.light.intensity = 0;
              collected++;
              document.getElementById('tip').textContent = `灯笼 ${collected}/4 · 走到金色出口`;
            }
          });
          // 出口
          if (px===COLS-2 && pz===ROWS-2) {
            if (collected >= 4) {
              document.getElementById('msgText').innerHTML = '全部灯笼已点亮！<br>你走出了纸灯迷宫 ✨';
              document.getElementById('msg').style.display = 'block';
            } else {
              document.getElementById('msgText').innerHTML = `还差 ${4-collected} 个灯笼<br>再去找找吧`;
              document.getElementById('msg').style.display = 'block';
              setTimeout(()=>{ document.getElementById('msg').style.display='none'; }, 1500);
            }
          }
          return;
        }
        const ease = t*t*(3-2*t);
        camera.position.x = start.x + (end.x-start.x)*ease;
        camera.position.z = start.z + (end.z-start.z)*ease;
        requestAnimationFrame(anim);
      }
      anim();
    }

    // 控制
    document.getElementById('up').ontouchstart = e => { e.preventDefault(); tryMove(0,-1); };
    document.getElementById('down').ontouchstart = e => { e.preventDefault(); tryMove(0,1); };
    document.getElementById('left').ontouchstart = e => { e.preventDefault(); tryMove(-1,0); };
    document.getElementById('right').ontouchstart = e => { e.preventDefault(); tryMove(1,0); };

    window.onkeydown = e => {
      if (e.key==='ArrowUp'||e.key==='w') tryMove(0,-1);
      if (e.key==='ArrowDown'||e.key==='s') tryMove(0,1);
      if (e.key==='ArrowLeft'||e.key==='a') tryMove(-1,0);
      if (e.key==='ArrowRight'||e.key==='d') tryMove(1,0);
    };

    function animate() {
      requestAnimationFrame(animate);
      // 轻轻摇摆灯笼
      lanterns.forEach((l,i) => {
        if (!l.got) l.mesh.position.y = 1.0 + Math.sin(Date.now()*0.003 + i)*0.05;
      });
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
